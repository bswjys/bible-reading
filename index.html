<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성경 통독</title>
<meta name="description" content="1년 1~3독 성경 통독 계획과 장별 체크, 밀린 분량 다시 맞추기">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성경 통독">
<meta name="theme-color" content="#F2F4F6">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F6; --card:#FFFFFF;
  --pri:#3182F6; --pri-soft:#E8F3FF; --pri-strong:#1B64DA;
  --tx:#191F28; --tx2:#6B7684; --tx3:#B0B8C1;
  --line:#E5E8EB; --line2:#F2F4F6;
  --red:#F04452; --red-soft:#FFF0F1;
  --green:#00C471; --green-soft:#E9FBF3;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,"Helvetica Neue",Arial,"Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  word-break:keep-all;overflow-wrap:break-word;
}
button{font:inherit;letter-spacing:inherit;color:inherit;border:0;background:transparent;padding:0;-webkit-appearance:none;appearance:none}
button:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
b{font-weight:700}

/* ---------- shell ---------- */
.appbar{
  position:sticky;top:0;z-index:30;
  padding:calc(var(--safe-t) + 10px) 0 10px;
  background:rgba(242,244,246,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.appbar-in{max-width:560px;margin:0 auto;padding:0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.appbar h1{font-size:24px;font-weight:800;letter-spacing:-0.035em;line-height:1.2}
.appbar .sub{font-size:12px;color:var(--tx2);font-weight:600;padding-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:560px;margin:0 auto;padding:0 20px calc(84px + var(--safe-b));}
.view.anim{animation:fade .18s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}

/* ---------- card ---------- */
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(17,24,39,.03)}
.card.tight{padding:16px 18px}
.card.flush{padding:0;overflow:hidden}
.card.soft{background:var(--pri-soft)}
.card.warn{background:var(--red-soft)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.start{align-items:flex-start}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2);font-size:13px;line-height:1.45}
.tiny{color:var(--tx3);font-size:11.5px;line-height:1.45}
.h3{font-size:17px;font-weight:700;letter-spacing:-0.02em}
.h2{font-size:19px;font-weight:800;letter-spacing:-0.03em}
.section-title{font-size:14px;font-weight:800;color:var(--tx);margin:22px 4px 9px;letter-spacing:-0.02em}
.section-title:first-child{margin-top:4px}
.divider{height:1px;background:var(--line2);margin:14px -20px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill.blue{background:var(--pri-soft);color:var(--pri-strong)}
.pill.gray{background:#F2F4F6;color:var(--tx2)}
.pill.green{background:var(--green-soft);color:#00985B}
.pill.red{background:#FFE4E7;color:var(--red)}
.pill.line{background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--tx2)}

/* ---------- progress ---------- */
.bar{height:8px;border-radius:999px;background:#E8EBEE;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:var(--pri);transition:width .45s cubic-bezier(.22,.8,.24,1)}
.bar.thin{height:6px}
.bar.green>i{background:var(--green)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--tx2);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- today hero ---------- */
.hero-num{font-size:46px;font-weight:800;letter-spacing:-0.055em;line-height:1.03;margin:14px 0 2px;font-variant-numeric:tabular-nums}
.hero-num small{font-size:20px;font-weight:800;letter-spacing:-0.01em;margin-left:3px;color:var(--tx2)}
.hero-num.done{color:var(--green)}
.hero-sub{font-size:13px;color:var(--tx2);font-weight:600}
.hero .metric{margin-top:15px}

/* ---------- chapter rows ---------- */
.chgroup{padding:0}
.grp{font-size:11.5px;font-weight:800;color:var(--tx3);letter-spacing:.02em;padding:14px 18px 6px;background:#FAFBFC;border-top:1px solid var(--line2)}
.grp + .chrow{border-top:0}
.chrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 18px;background:#fff;border:0;border-top:1px solid var(--line2);cursor:pointer}
.card.flush .chrow:nth-child(1){border-top:0}
.chrow:active{background:#F8F9FA}
.chrow .chk{width:24px;height:24px;border-radius:50%;border:2px solid #D5DAE0;flex:0 0 auto;display:grid;place-items:center;background:#fff;transition:background .15s,border-color .15s}
.chrow .chk svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s}
.chrow.done .chk{background:var(--pri);border-color:var(--pri)}
.chrow.done .chk svg{opacity:1}
.chrow .nm{font-size:15px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:baseline;gap:7px}
.chrow.done .nm{color:var(--tx3)}
.chrow .tag{font-size:10.5px;font-weight:800;color:var(--tx2);background:#F2F4F6;border-radius:6px;padding:2px 5px}
.chrow .right{margin-left:auto;font-size:12px;font-weight:700;color:var(--tx3)}
.chrow.done .right{color:var(--pri)}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  border:0;border-radius:14px;padding:15px 16px;margin-top:14px;
  background:var(--pri);color:#fff;font-size:16px;font-weight:800;letter-spacing:-0.02em;
  cursor:pointer;transition:transform .1s, background .15s;
}
.btn:active{transform:scale(.985);background:var(--pri-strong)}
.btn.ghost{background:#F2F4F6;color:var(--tx)}
.btn.ghost:active{background:#E8EBEE}
.btn.done{background:var(--green-soft);color:#00985B}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.god{background:var(--pri-soft);color:var(--pri-strong);margin-top:8px}
.btn.god:active{background:#D6E9FF}
.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:11px;width:auto;margin:0}
.btn.sm.full{width:100%;padding:12px 14px}

/* ---------- week strip ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:14px 10px 12px}
.wcell{border:0;background:transparent;border-radius:12px;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.wcell .wd{font-size:10.5px;font-weight:700;color:var(--tx3)}
.wcell .wn{font-size:15px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.wcell .ws{font-size:9.5px;font-weight:700;color:var(--tx3);height:13px;line-height:13px;font-variant-numeric:tabular-nums}
.wcell.done{background:var(--pri)}
.wcell.done .wd,.wcell.done .wn{color:#fff}
.wcell.done .ws{color:rgba(255,255,255,.9)}
.wcell.part{background:var(--pri-soft)}
.wcell.part .wn{color:var(--pri-strong)}
.wcell.part .ws{color:var(--pri)}
.wcell.sun .wd{color:var(--red)}
.wcell.sun.done .wd,.wcell.sun.done .wn{color:#fff}
.wcell.off{opacity:.4}
.wcell.out{opacity:.4}
.wcell.today{box-shadow:inset 0 0 0 2px var(--pri)}
.wcell.done.today{box-shadow:inset 0 0 0 2px var(--tx)}
.wcell.miss .ws{color:var(--red)}

/* ---------- book list ---------- */
.bookrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 16px;background:#fff;border:0;border-top:1px solid var(--line2);cursor:pointer}
.bookrow:first-child{border-top:0}
.bookrow:active{background:#F8F9FA}
.bookrow .bn{font-size:14.5px;font-weight:700;letter-spacing:-0.02em;flex:0 0 96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookrow .bmeta{font-size:12px;font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:48px;text-align:right}
.bookrow .bbar{flex:1;min-width:24px}
.bookrow .chev{color:var(--tx3);font-size:15px;font-weight:700;transition:transform .2s;flex:0 0 auto}
.bookrow.open .chev{transform:rotate(90deg)}
.bookrow .bcheck{color:var(--pri);font-weight:800;font-size:12px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:4px 16px 16px;background:#FAFBFC;border-top:1px solid var(--line2)}
.chcell{position:relative;border:0;border-radius:10px;background:#EEF1F4;color:var(--tx2);height:38px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;transition:background .12s,color .12s}
.chcell:active{transform:scale(.95)}
.chcell.r1{background:var(--pri-soft);color:var(--pri-strong)}
.chcell.full{background:var(--pri);color:#fff}
.chcell .b{position:absolute;top:2px;right:3px;font-size:8.5px;font-weight:800;line-height:1;opacity:.9}
.chcell.full .b{color:#fff}
.chcell.r1 .b{color:var(--pri-strong)}

/* ---------- segmented ---------- */
.seg{display:flex;gap:4px;background:#E8EBEE;border-radius:14px;padding:4px;margin-bottom:0}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 4px;font-size:14px;font-weight:800;color:var(--tx2);cursor:pointer;transition:background .15s,color .15s;letter-spacing:-0.02em}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(17,24,39,.08)}

/* ---------- option cards ---------- */
.opt{display:block;width:100%;border:0;border-radius:14px;background:#F2F4F6;padding:14px 15px;text-align:left;cursor:pointer;transition:background .15s,box-shadow .15s;margin-top:8px}
.opt .n{display:block;font-size:15px;font-weight:800;letter-spacing:-0.02em}
.opt .d{display:block;font-size:12px;color:var(--tx2);font-weight:600;margin-top:3px;line-height:1.45}
.opt.on{background:var(--pri-soft);box-shadow:inset 0 0 0 1.6px var(--pri)}
.opt.on .n{color:var(--pri-strong)}
.opt.on .d{color:var(--pri-strong)}
.opt .n::after{content:"";float:right;font-size:15px;color:var(--pri)}
.opt.on .n::after{content:"✓"}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:800;color:var(--tx2);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;letter-spacing:-0.02em}
.chip.on{background:var(--pri);color:#fff;box-shadow:none}

/* ---------- setting rows ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line2);font-size:14px}
.set-row:first-child{border-top:0}
.set-row .k{font-weight:700}
.set-row .d{font-size:12px;color:var(--tx2);font-weight:600;margin-top:2px}
.set-row .v{font-weight:700;color:var(--tx2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
input[type=date]{font:inherit;font-size:14px;font-weight:700;color:var(--tx);border:1px solid var(--line);background:#F7F8FA;border-radius:10px;padding:8px 10px;-webkit-appearance:none;appearance:none;min-width:148px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.set-block{padding:16px}
.set-block+.set-block{border-top:1px solid var(--line2)}
.set-label{font-size:14px;font-weight:700;margin-bottom:2px}

/* ---------- calendar ---------- */
.cal{padding:8px 10px 14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 12px}
.cal-title{font-size:17px;font-weight:800;letter-spacing:-0.03em}
.navbtn{width:34px;height:34px;border-radius:11px;border:0;background:#F2F4F6;color:var(--tx2);font-size:16px;font-weight:800;cursor:pointer;display:grid;place-items:center;line-height:1}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.dow-row span{text-align:center;font-size:11px;font-weight:700;color:var(--tx3);padding:2px 0}
.dow-row span:first-child{color:var(--red)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{border:0;background:transparent;border-radius:12px;height:47px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.cell .cn{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.cell .cs{font-size:8.5px;font-weight:800;height:10px;line-height:10px;color:var(--tx3);font-variant-numeric:tabular-nums}
.cell.off{opacity:.32}
.cell.out{visibility:hidden}
.cell.sun{background:#FAFBFC}
.cell.sun .cn{color:var(--red)}
.cell.sun .cs{color:#C9CED4}
.cell.done{background:var(--pri)}
.cell.done .cn{color:#fff}
.cell.done .cs{color:rgba(255,255,255,.88)}
.cell.part{background:var(--pri-soft)}
.cell.part .cn{color:var(--pri-strong)}
.cell.part .cs{color:var(--pri)}
.cell.miss .cn{color:var(--red)}
.cell.miss .cs{color:var(--red)}
.cell.today{box-shadow:inset 0 0 0 2px var(--pri)}
.cell.done.today{box-shadow:inset 0 0 0 2px var(--tx)}
.legend{display:flex;flex-wrap:wrap;gap:9px 13px;padding:13px 8px 2px;border-top:1px solid var(--line2);margin-top:10px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:1px}
.legend span{font-size:11px;color:var(--tx2);font-weight:700}
.cal-sum{padding:0 6px 8px;font-size:12.5px;color:var(--tx2);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- more ---------- */
.more-hero{display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;border-radius:16px;display:block;flex:0 0 auto;box-shadow:0 2px 8px rgba(27,100,218,.18)}
.slot{display:flex;align-items:center;gap:13px;padding:14px 16px;background:#fff;border-top:1px solid var(--line2);width:100%;text-align:left}
.slot:first-child{border-top:0}
.slot .ico{width:38px;height:38px;border-radius:12px;background:#F2F4F6;display:grid;place-items:center;flex:0 0 auto}
.slot .ico svg{width:20px;height:20px;stroke:var(--tx2);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.slot .t1{display:block;font-size:14.5px;font-weight:700}
.slot .t2{display:block;font-size:12px;color:var(--tx3);font-weight:600;margin-top:1px}
.slot .v{margin-left:auto;font-size:13px;font-weight:700;color:var(--tx2);white-space:nowrap}
.slot.danger .t1{color:var(--red)}
.info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid var(--line2);font-size:13.5px}
.info-row:first-child{border-top:0}
.info-row .k{color:var(--tx2);font-weight:600}
.info-row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
details.guide{background:#fff;border-radius:20px;padding:0;overflow:hidden;margin-bottom:12px}
details.guide summary{list-style:none;padding:15px 16px;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"+";color:var(--tx3);font-weight:800}
details.guide[open] summary::after{content:"–"}
.guide-body{padding:0 16px 16px;font-size:13px;color:var(--tx2);line-height:1.7}
.guide-body ol{padding-left:18px;margin:6px 0 0}
.guide-body li{margin-bottom:5px}
.guide-body b{color:var(--tx)}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:58px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);cursor:pointer;padding:0}
.tab svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:700;letter-spacing:-0.01em}
.tab.on{color:var(--pri)}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.42);opacity:0;pointer-events:none;transition:opacity .22s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-width:560px;margin:0 auto;background:#fff;
  border-radius:24px 24px 0 0;padding:10px 0 calc(16px + var(--safe-b));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.8,.24,1);
  max-height:85vh;overflow:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 -8px 30px rgba(17,24,39,.12);
}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:999px;background:#E5E8EB;margin:4px auto 10px}
.sheet-head{padding:0 20px 4px}
.sheet h3{font-size:19px;font-weight:800;letter-spacing:-0.03em;margin:4px 0 2px}
.sheet .chlist{border-radius:16px;overflow:hidden;margin:12px 16px 0;box-shadow:inset 0 0 0 1px var(--line2)}
.sheet .chrow{padding:12px 14px}
.sheet .pad{padding:0 20px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(78px + var(--safe-b));transform:translate(-50%,12px);
  z-index:80;background:rgba(25,31,40,.95);color:#fff;
  padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:calc(100vw - 40px);
  overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media (min-width:768px){
  body{background:#EDEFF2}
  .appbar{background:rgba(237,239,242,.92);padding-top:20px}
  .tabbar{background:rgba(255,255,255,.98)}
  main{padding-bottom:calc(88px + var(--safe-b))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <h1 id="appTitle">오늘</h1>
    <div class="sub" id="appSub"></div>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" aria-label="주요 메뉴">
  <div class="tabbar-in" id="tabbar">
    <button class="tab" type="button" data-action="tab" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M12 6.5C10.6 5.2 8.6 4.6 6 4.6c-.9 0-1.6.1-2 .2v14.4c.4-.1 1.1-.2 2-.2 2.6 0 4.6.6 6 1.9"/><path d="M12 6.5c1.4-1.3 3.4-1.9 6-1.9.9 0 1.6.1 2 .2v14.4c-.4-.1-1.1-.2-2-.2-2.6 0-4.6.6-6 1.9z"/><path d="M12 6.5V21"/></svg>
      <span>오늘</span>
    </button>
    <button class="tab" type="button" data-action="tab" data-tab="table">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M9 9.5V20M15 9.5V20"/></svg>
      <span>읽기표</span>
    </button>
    <button class="tab" type="button" data-action="tab" data-tab="calendar">
